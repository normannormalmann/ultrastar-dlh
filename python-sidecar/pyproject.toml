[project]
name = "ultrastar-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["num2words>=0.5"]

[project.optional-dependencies]
# Modell-Abhaengigkeiten getrennt, damit reine Tests ohne sie laufen.
#
# numba braucht eine Untergrenze, obwohl es niemand direkt importiert:
# librosa zieht es nach, und moderne numba-Versionen begrenzen numpy nach
# oben. Ohne diese Grenze weicht die Aufloesung auf numba 0.53.1 aus, das
# keine solche Grenze kennt — und dessen llvmlite 0.36 laesst sich fuer
# Python 3.12 nicht bauen. Mit der Grenze landet sie bei numba 0.66 und
# nimmt numpy dafuer auf 2.4 zurueck.
models = [
  "demucs",
  "whisperx",
  "swift-f0",
  "librosa",
  "numba>=0.59",
  "torch",
  "torchaudio",
]
dev = ["pytest", "pyphen"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: braucht Modelle oder GPU, standardmaessig uebersprungen"]
# -ra macht uebersprungene Tests im Bericht sichtbar: ein Lauf ohne GPU
# darf nicht wie "alles gruen" aussehen.
addopts = "-m 'not slow' -ra"
