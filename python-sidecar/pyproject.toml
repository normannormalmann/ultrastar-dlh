[project]
name = "ultrastar-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
# pyphen ist eine LAUFZEIT-Abhaengigkeit (Silbentrennung in syllables.py),
# kein Test-Werkzeug: als es nur im dev-Extra stand, fehlte es in der
# automatisch eingerichteten Umgebung ([models]-Install) und der Notenbau
# fiel still auf ganze Woerter zurueck — im Durchstich gemessen als
# Notendiff -174 statt -15 bei identischem Song.
dependencies = ["num2words>=0.5", "pyphen>=0.14"]

[project.optional-dependencies]
# Modell-Abhaengigkeiten getrennt, damit reine Tests ohne sie laufen.
#
# numba braucht eine Untergrenze, obwohl es niemand direkt importiert:
# librosa zieht es nach, und moderne numba-Versionen begrenzen numpy nach
# oben. Ohne diese Grenze weicht die Aufloesung auf numba 0.53.1 aus, das
# keine solche Grenze kennt — und dessen llvmlite 0.36 laesst sich fuer
# Python 3.12 nicht bauen. Mit der Grenze landet sie bei numba 0.66 und
# nimmt numpy dafuer auf 2.4 zurueck.
models = [
  "demucs",
  "whisperx",
  "swift-f0",
  "librosa",
  "numba>=0.59",
  "torch",
  "torchaudio",
  # numpy wird direkt in __main__.py und align.py importiert (inkl. des
  # NumPy-2-Workarounds dort) - bisher nur transitive Abhaengigkeit ueber
  # librosa/numba, ihre Versionssensitivitaet gehoert aber deklariert.
  "numpy",
]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: braucht Modelle oder GPU, standardmaessig uebersprungen"]
# -ra macht uebersprungene Tests im Bericht sichtbar: ein Lauf ohne GPU
# darf nicht wie "alles gruen" aussehen.
addopts = "-m 'not slow' -ra"
