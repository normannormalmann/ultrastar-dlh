appId: com.github.normannormalmann.ultrastar
productName: UltraStar - Dirty Little Helper
directories:
  output: dist
# electron-updater reads this from the app-update.yml that gets baked into
# the package; without it the app has no feed to check.
publish:
  provider: github
  owner: normannormalmann
  repo: ultrastar-dlh
files:
  - out/**
  - package.json
  - "!node_modules/**"
npmRebuild: false
nodeGypRebuild: false
# All runtime code is bundled by electron-vite; no node_modules are needed at runtime.
extraMetadata:
  dependencies: {}
extraResources:
  - from: python-sidecar
    to: python-sidecar
    filter:
      - "**/*"
      - "!.venv*/**"
      - "!.uv-bin/**"
      - "!tests/**"
      - "!**/__pycache__/**"
      - "!.pipeline-cache/**"
win:
  artifactName: UltraStar-DLH-Setup-${version}.${ext}
  target:
    - nsis
  signAndEditExecutable: false
  icon: resources/icon.ico
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
linux:
  artifactName: UltraStar-DLH-${version}.${ext}
  target:
    - AppImage
  icon: resources/icon.png
  category: AudioVideo
  executableName: ultrastar-dlh
