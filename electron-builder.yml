appId: com.github.normannormalmann.ultrastar
productName: UltraStar - Dirty Little Helper
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!node_modules/**"
npmRebuild: false
nodeGypRebuild: false
# All runtime code is bundled by electron-vite; no node_modules are needed at runtime.
extraMetadata:
  dependencies: {}
extraResources:
  - from: python-sidecar
    to: python-sidecar
    filter:
      - "**/*"
      - "!.venv*/**"
      - "!.uv-bin/**"
      - "!tests/**"
      - "!**/__pycache__/**"
      - "!.pipeline-cache/**"
win:
  target:
    - nsis
  signAndEditExecutable: false
  icon: resources/icon.ico
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
  icon: resources/icon.png
  category: AudioVideo
  executableName: ultrastar-dlh
