version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    groups:
      prod-dependencies:
        dependency-type: production
        patterns: ['*']
      dev-dependencies:
        dependency-type: development
        patterns: ['*']
    versioning-strategy: increase
    commit-message:
      prefix: chore
      prefix-development: chore(deps)
      include: scope

  - package-ecosystem: pip
    directory: /python-sidecar
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    labels: [github-actions, dependencies]
    commit-message:
      prefix: ci
      include: scope
