name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BUN_VERSION: "1.2.19"

jobs:
  determine_tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      # A release is what users install, so it has to come from what main
      # actually contains. Pre-release tags are exempt.
      - name: Require the tag to sit on main
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -(next|canary|beta|rc) ]]; then
            echo "Pre-release tag $TAG - skipping the main branch check."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error ::The tagged commit is not on main."
            exit 1
          fi
          echo "Tagged commit is on main."

  # Creates the GitHub release for this tag. Everything below uploads into it,
  # so those jobs wait for this one.
  changelog:
    runs-on: ubuntu-latest
    needs: [determine_tag]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Generate changelog
        run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Nothing is published from this bundle - it only proves the CLI entry still
  # builds, which no other workflow checks.
  build_cli:
    runs-on: ubuntu-latest
    needs: determine_tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun i

      - name: Build CLI
        run: bun run build

  build_desktop_windows:
    runs-on: windows-latest
    needs: [determine_tag, changelog]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun i

      # electron-builder publishes on its own as soon as it sees a tag in CI
      # and aborts without a token. We upload explicitly instead.
      - name: Build Windows installer
        run: bun run desktop:dist:win --publish never

      - name: Attach installer to the release
        shell: bash
        # latest.yml is the feed electron-updater polls; without it the
        # installed app can never see this release.
        run: gh release upload "${{ github.ref_name }}" dist/*Setup*.exe dist/*Setup*.exe.blockmap dist/latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_desktop_linux:
    runs-on: ubuntu-latest
    needs: [determine_tag, changelog]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun i

      - name: Build Linux AppImage
        run: bun run desktop:dist:linux --publish never

      - name: Attach AppImage to the release
        run: gh release upload "${{ github.ref_name }}" dist/*.AppImage dist/latest-linux.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    runs-on: ubuntu-latest
    needs: [determine_tag, changelog, build_cli, build_desktop_windows, build_desktop_linux]
    if: always()
    steps:
      - name: Create release summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 🚀 Release summary

          ## 📦 Release Information

          - **Version**: `${{ needs.determine_tag.outputs.version }}`
          - **Commit**: `${{ github.sha }}`
          - **Triggered by**: `${{ github.actor }}`

          ## 📋 Job Status

          | Job | Status |
          |-----|:------:|
          | Changelog | ${{ needs.changelog.result == 'success' && '✅' || '❌' }} |
          | CLI build check | ${{ needs.build_cli.result == 'success' && '✅' || '❌' }} |
          | Desktop (Windows installer) | ${{ needs.build_desktop_windows.result == 'success' && '✅' || '❌' }} |
          | Desktop (Linux AppImage) | ${{ needs.build_desktop_linux.result == 'success' && '✅' || '❌' }} |

          ## 🔗 Links
          - **📝 Release Notes**: [View Changelog](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.determine_tag.outputs.version }})
          EOF
