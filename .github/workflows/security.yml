name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Accepted risk: GHSA-mh99-v99m-4gvg (CVE-2026-14257) in brace-expansion.
      # Patched only in 5.0.8; the 1.x and 2.x lines have no backport. The tree
      # still pulls brace-expansion 1.1.16 and 2.1.2 via minimatch 3.x/5.x/9.x
      # (exceljs > archiver > glob, electron-builder > @electron/asar). Both
      # parents are already at their latest release, so no upgrade path exists.
      # A global override to 5.0.8 is NOT viable: its CommonJS entry exports an
      # object ({ expand, ... }), while minimatch 3.x/5.x/9.x do
      # `require('brace-expansion')` and call the result directly - that would
      # throw at runtime in the exceljs export path.
      # Impact is limited to a DoS from adversarial glob patterns; all patterns
      # here are library-internal, never user-supplied.
      # TODO: drop this ignore once brace-expansion 1.1.17 / 2.1.3 ship the fix.
      - name: Run audit (high severity and above)
        run: bun audit --audit-level=high --ignore=GHSA-mh99-v99m-4gvg
        continue-on-error: false

      - name: Run audit (production dependencies only)
        run: bun audit --prod --audit-level=moderate --ignore=GHSA-mh99-v99m-4gvg
        continue-on-error: false

      - name: Check for outdated dependencies
        run: bun outdated || true

      - name: Generate security report
        if: always()
        run: |
          echo "## Security Scan Results" > $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Security audit completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security audit found issues or failed to run" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Audit Levels" >> $GITHUB_STEP_SUMMARY
          echo "- **High/Severe**: Failed the build" >> $GITHUB_STEP_SUMMARY
          echo "- **Moderate (production)**: Failed the build" >> $GITHUB_STEP_SUMMARY
