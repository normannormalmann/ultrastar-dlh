name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.3'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bunx tsc --noEmit

  bun-test:
    name: Bun tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run tests
        run: bun run test

  # The main bundle must not only build, it must load: v1.5.0 shipped a
  # bundle that threw on startup (a named ESM import of a CommonJS module
  # after electron-vite started externalizing dependencies) and no job
  # here would have noticed. This one starts the built app under Xvfb.
  desktop-smoke:
    name: Desktop smoke (built app starts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # With lifecycle scripts: Electron's postinstall fetches the binary.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build the desktop app
        run: bun run desktop:build
      - name: Start the built app
        run: xvfb-run -a bunx playwright test e2e/app.spec.ts --reporter=list

  python-test:
    name: Sidecar tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The fast suite stubs the models; numpy is the only model-side
      # package it imports. Tests marked slow (real models) stay deselected.
      - name: Install sidecar without model dependencies
        run: python -m pip install -e python-sidecar pytest numpy
      - name: Run fast tests
        working-directory: python-sidecar
        run: python -m pytest tests/ -v
